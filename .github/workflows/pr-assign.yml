name: pr-assign

on:
  pull_request_target:
    types: [opened, reopened, converted_to_draft, ready_for_review]

permissions:
  pull-requests: write

env:
  # Comma-separated GitHub usernames. Each person must be a collaborator.
  # Example: REVIEWERS: orbingol,octocat
  REVIEWERS: orbingol

jobs:
  pr-assign:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request
            const reviewers = process.env.REVIEWERS.split(",")
              .map((name) => name.trim())
              .filter((name) => name && name !== pr.user.login)
            const repo = { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number }

            if (context.payload.action === "converted_to_draft") {
              const requested = new Set((pr.requested_reviewers || []).map((user) => user.login))
              const toRemove = reviewers.filter((name) => requested.has(name))
              if (toRemove.length > 0) {
                await github.rest.pulls.removeRequestedReviewers({ ...repo, reviewers: toRemove })
              }
              return
            }

            if (pr.draft || reviewers.length === 0) return

            await github.rest.pulls.requestReviewers({ ...repo, reviewers })
