name: release

on:
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CIBW_VERSION: "4.3.5"

jobs:
  build-wheels:
    # name: Build wheels on ${{ matrix.os }}
    # runs-on: ${{ matrix.os }}
    # strategy:
    #   matrix:
    #     os: [ ubuntu-26.04 ]
    # steps:
    #   - name: Checkout
    #     uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    #   - name: Set up Python
    #     uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
    #     with:
    #       python-version: ${{ env.PYTHON_VERSION }}
    #   - name: Install cibuildwheel
    #     run: python -m pip install cibuildwheel==${{ env.CIBW_VERSION }}
    #   - name: Build wheels
    #     run: python -m cibuildwheel --output-dir wheelhouse
    #   - name: Upload artifacts
    #     uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
    #     with:
    #       name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
    #       path: ./wheelhouse/*.whl
    #       retention-days: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install python build
        run: python -m pip install build
      - name: Build sdist and wheel
        run: python -m build -o wheelhouse
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cibw-wheels-python
          path: ./wheelhouse/*
          retention-days: 1

  publish-github-releases:
    runs-on: ubuntu-26.04
    needs: [ build-wheels ]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cibw-wheels-*
          path: ./wheelhouse
          merge-multiple: true
      - name: Publish packages to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: ./wheelhouse/*

  publish-pypi:
    runs-on: ubuntu-26.04
    needs: [ build-wheels ]
    environment:
      name: pypi
      url: https://pypi.org/p/geomdl
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cibw-wheels-*
          path: ./wheelhouse/
          merge-multiple: true
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: ./wheelhouse/
